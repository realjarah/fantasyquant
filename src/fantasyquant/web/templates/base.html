<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FantasyQuant{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            fq: {
              bg: '#0f172a',
              card: '#1e293b',
              border: '#334155',
              accent: '#3b82f6',
              green: '#22c55e',
              red: '#ef4444',
              amber: '#f59e0b',
              muted: '#94a3b8',
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
    @keyframes pulse-border { 0%,100% { border-color: #3b82f6; } 50% { border-color: #22c55e; } }
    .on-clock { animation: pulse-border 2s ease-in-out infinite; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="h-full bg-fq-bg text-slate-200">
  {% block body %}{% endblock %}
</body>
</html>
